<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Manage Slots</title>
	<style>
		:root {
			--darkest-color: #111;
			--lightest-color: #eee;
			--light-color: #dedede;
			--dark-color: #323232;
			--neutral-color: #777;
		}

		body {
			margin: 0;
			padding: 20px;
			color: var(--darkest-color);
			background-color: var(--lightest-color);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			box-sizing: border-box;
			border: 2px solid var(--darkest-color);
			border-radius: 16px;
			font-family: 'Source Serif Pro', system-ui, Avenir, Helvetica, Arial, sans-serif;
		}

		h3 {
			margin-top: 0;
			margin-bottom: 15px;
			color: var(--lightest-color);
			background-color: var(--darkest-color);
			width: 100%;
			text-align: center;
			padding: 10px 0;
			position: absolute;
			top: 0;
			left: 0;
			border-radius: 12px 12px 0 0;
		}

		.slots {
			display: flex;
			flex-direction: column;
			gap: 10px;
			width: 100%;
			margin-top: 40px;
		}

		button {
			padding: 10px;
			cursor: pointer;
			background-color: var(--lightest-color);
			border: 2px solid var(--darkest-color);
			border-radius: 6px;
			font-weight: bold;
			font-size: 16px;
			color: var(--darkest-color);
		}

		button:hover {
			background-color: var(--darkest-color);
			color: var(--lightest-color);
		}

		button.active {
			background-color: var(--darkest-color);
			color: var(--lightest-color);
		}

		.actions {
			display: flex;
			gap: 10px;
			margin-top: 20px;
			width: 100%;
			border-top: 2px solid var(--darkest-color);
			padding-top: 20px;
		}

		.actions button {
			flex: 1;
		}
	</style>
</head>

<body>
	<h3>Character Slots</h3>
	<div class="slots" id="slots-container">
		<!-- Slots will be generated here -->
	</div>

	<div class="actions">
		<button id="btn-import">Import JSON</button>
		<button id="btn-export">Export JSON</button>
	</div>
	<div class="actions" style="margin-top: 10px; border-top: none; padding-top: 0;">
		<button id="btn-import-all">Import All</button>
		<button id="btn-export-all">Export All</button>
	</div>
	<input type="file" id="file-input" style="display: none;" accept=".json">
	<input type="file" id="file-input-all" style="display: none;" accept=".json">

	<script type="module" src="/src/slots_modal.ts"></script>
</body>

</html>
